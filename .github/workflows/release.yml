name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  RELEASE_DIST_DIR: release-dist-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate:
    if: (github.event_name == 'push' && !github.event.deleted) || github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      ci-run-id: ${{ steps.candidate.outputs.run-id }}
      manifest-id: ${{ steps.candidate.outputs.manifest-id }}
      python-id: ${{ steps.candidate.outputs.python-id }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve the unique tested tag candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            args+=(--require-testpypi)
          fi
          python scripts/release_candidate.py resolve --manifest candidate.json --dist validated-dist "${args[@]}"

  publish-testpypi-core:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nexuml
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-artifact
        with:
          manifest-id: ${{ needs.validate.outputs.manifest-id }}
          artifact-id: ${{ needs.validate.outputs.python-id }}
          run-id: ${{ needs.validate.outputs.ci-run-id }}
          directory: ${{ env.RELEASE_DIST_DIR }}
          group: python

      - name: Publish core to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.RELEASE_DIST_DIR }}/nexuml/
          repository-url: https://test.pypi.org/legacy/

  publish-testpypi-library:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - validate
      - publish-testpypi-core
    runs-on: ubuntu-latest
    environment:
      name: testpypi-library
      url: https://test.pypi.org/p/nexuml-library
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-artifact
        with:
          manifest-id: ${{ needs.validate.outputs.manifest-id }}
          artifact-id: ${{ needs.validate.outputs.python-id }}
          run-id: ${{ needs.validate.outputs.ci-run-id }}
          directory: ${{ env.RELEASE_DIST_DIR }}
          group: python

      - name: Publish library to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.RELEASE_DIST_DIR }}/nexuml-library/
          repository-url: https://test.pypi.org/legacy/

  verify-testpypi:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - validate
      - publish-testpypi-library
    runs-on: ubuntu-latest
    env:
      NEXUML_EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/release-artifact
        with:
          manifest-id: ${{ needs.validate.outputs.manifest-id }}
          artifact-id: ${{ needs.validate.outputs.python-id }}
          run-id: ${{ needs.validate.outputs.ci-run-id }}
          directory: ${{ env.RELEASE_DIST_DIR }}
          group: python

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Download NexuML wheels from TestPyPI
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          uv venv --seed --python 3.12 .venv-download
          .venv-download/bin/python -m pip download --no-deps --only-binary=:all: --dest test-dist --index-url https://test.pypi.org/simple "nexuml==$VERSION" "nexuml-library==$VERSION"

      - name: Verify registry wheel bytes against the original candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_candidate.py verify --manifest release-candidate/candidate.json --dist test-dist --group wheels

      - name: Verify TestPyPI core install
        env:
          CUDA_VISIBLE_DEVICES: ""
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          uv venv --no-config --python 3.12 .venv-core
          uv pip install --no-config --python .venv-core/bin/python --default-index https://pypi.org/simple pytest "test-dist/nexuml-$VERSION-py3-none-any.whl"
          env -u PYTHONPATH NEXUML_INSTALLED_DIST_TEST=1 .venv-core/bin/python -I -m pytest -c /dev/null --rootdir=tests/packaging --confcutdir=tests/packaging -q tests/packaging/test_installed_distributions.py -k core

      - name: Verify TestPyPI library extra install
        env:
          CUDA_VISIBLE_DEVICES: ""
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          uv venv --no-config --python 3.12 .venv-library
          uv pip install --no-config --python .venv-library/bin/python --default-index https://pypi.org/simple pytest "test-dist/nexuml-$VERSION-py3-none-any.whl[library]" "test-dist/nexuml_library-$VERSION-py3-none-any.whl"
          env -u PYTHONPATH NEXUML_INSTALLED_DIST_TEST=1 .venv-library/bin/python -I -m pytest -c /dev/null --rootdir=tests/packaging --confcutdir=tests/packaging -q tests/packaging/test_installed_distributions.py -k library

      - name: Bind successful TestPyPI verification to the candidate
        run: python scripts/release_candidate.py record-testpypi --manifest release-candidate/candidate.json --output testpypi-evidence/verification.json

      - uses: actions/upload-artifact@v6
        with:
          name: testpypi-verification-${{ github.run_attempt }}
          path: testpypi-evidence/verification.json
          if-no-files-found: error
          retention-days: 7

  publish-pypi-core:
    if: github.event_name == 'release'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nexuml
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-artifact
        with:
          manifest-id: ${{ needs.validate.outputs.manifest-id }}
          artifact-id: ${{ needs.validate.outputs.python-id }}
          run-id: ${{ needs.validate.outputs.ci-run-id }}
          directory: ${{ env.RELEASE_DIST_DIR }}
          group: python

      - name: Publish core to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.RELEASE_DIST_DIR }}/nexuml/

  publish-pypi-library:
    if: github.event_name == 'release'
    needs:
      - validate
      - publish-pypi-core
    runs-on: ubuntu-latest
    environment:
      name: pypi-library
      url: https://pypi.org/p/nexuml-library
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-artifact
        with:
          manifest-id: ${{ needs.validate.outputs.manifest-id }}
          artifact-id: ${{ needs.validate.outputs.python-id }}
          run-id: ${{ needs.validate.outputs.ci-run-id }}
          directory: ${{ env.RELEASE_DIST_DIR }}
          group: python

      - name: Publish library to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ env.RELEASE_DIST_DIR }}/nexuml-library/

  github-release:
    if: github.event_name == 'release'
    needs:
      - validate
      - publish-pypi-library
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-artifact
        with:
          manifest-id: ${{ needs.validate.outputs.manifest-id }}
          artifact-id: ${{ needs.validate.outputs.python-id }}
          run-id: ${{ needs.validate.outputs.ci-run-id }}
          directory: ${{ env.RELEASE_DIST_DIR }}
          group: python

      - name: Upload GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$RELEASE_DIST_DIR"/nexuml/* \
            "$RELEASE_DIST_DIR"/nexuml-library/*
