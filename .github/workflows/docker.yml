name: Docker image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  # Serialize publication across refs without discarding queued release builds.
  group: docker-image
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write

env:
  CUDA_VERSION: 12.8.1
  IMAGE_NAME: ghcr.io/nexufed/nexuml
  LOCAL_IMAGE: nexuml:ci
  PYTHON_VERSION: "3.13"
  UBUNTU_VERSION: "24.04"

jobs:
  build:
    runs-on: ika-runner

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate trusted revision
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: ./.github/actions/prepare-release
        if: startsWith(github.ref, 'refs/tags/')

      # Docker Hub mirror (disabled): add docker.io/${{ vars.DOCKERHUB_USERNAME }}/nexuml
      # as a second image below, then enable the login step after configuring its token.
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
            suffix=-cuda${{ env.CUDA_VERSION }},onlatest=true
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=NexuML
            org.opencontainers.image.description=Complete NexuML CUDA development and training environment
            org.opencontainers.image.vendor=NexuFed AI
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.base.name=nvidia/cuda:${{ env.CUDA_VERSION }}-devel-ubuntu${{ env.UBUNTU_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Record runner capacity
        run: |
          df -h .
          docker system df

      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            PYTHON_VERSION=${{ env.PYTHON_VERSION }}
            UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
          cache-from: type=gha,scope=nexuml-cuda
          cache-to: type=gha,mode=min,scope=nexuml-cuda
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          platforms: linux/amd64
          push: false
          tags: ${{ env.LOCAL_IMAGE }}

      - name: Verify local image
        env:
          EXPECTED_CUDA: ${{ env.CUDA_VERSION }}
          EXPECTED_PYTHON: ${{ env.PYTHON_VERSION }}
        run: |
          expected_version=$(python3 - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )

          docker run --rm \
            --entrypoint /bin/bash \
            -e EXPECTED_CUDA \
            -e EXPECTED_PYTHON \
            -e EXPECTED_VERSION="$expected_version" \
            "$LOCAL_IMAGE" -lc '
              python - <<"PY"
          import importlib.metadata
          import os
          import sys

          import nexuml
          import nexuml_library
          import torch

          assert sys.version_info[:2] == tuple(map(int, os.environ["EXPECTED_PYTHON"].split(".")))
          assert os.environ["NEXUML_CUDA_VERSION"] == os.environ["EXPECTED_CUDA"]
          assert torch.version.cuda == ".".join(os.environ["EXPECTED_CUDA"].split(".")[:2])
          assert importlib.metadata.version("nexuml") == os.environ["EXPECTED_VERSION"]
          assert importlib.metadata.version("nexuml-library") == os.environ["EXPECTED_VERSION"]
          PY
              uv pip check
              nexuml --help >/dev/null
            '
          docker run --rm "$LOCAL_IMAGE"
          docker image inspect "$LOCAL_IMAGE" --format 'Image size: {{.Size}} bytes'
          df -h .

      # - name: Log in to Docker Hub
      #   if: github.event_name == 'push'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ vars.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image
        if: github.event_name == 'push'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          latest_tag=""
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            git fetch --tags origin main:refs/remotes/origin/main
            latest_tag=$(python3 - <<'PY'
          import subprocess

          from scripts.release_versions import stable_version

          tags = subprocess.check_output(
              ["git", "tag", "--merged", "origin/main", "--list", "v*"], text=True
          ).splitlines()
          versions = []
          for tag in tags:
              try:
                  version = stable_version(tag)
              except ValueError:
                  continue
              versions.append((tuple(map(int, version.split("."))), tag))
          print(max(versions)[1])
          PY
            )
          fi

          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            if [ "$tag" = "$IMAGE_NAME:latest-cuda$CUDA_VERSION" ] && [ "$GITHUB_REF_NAME" != "$latest_tag" ]; then
              echo "Skip latest promotion: $GITHUB_REF_NAME is older than $latest_tag"
              continue
            fi
            docker tag "$LOCAL_IMAGE" "$tag"
            docker push "$tag"
          done <<< "$TAGS"
