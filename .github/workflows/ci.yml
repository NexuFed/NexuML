name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ika-runner
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Verify lockfile
        run: uv lock --check

      - name: Install nexuml + library
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install -e ".[dev,all,dali]"
          uv pip install -e "./library[all]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Verify independently installable agent skills
        run: |
          python skills/tests/check_skills.py
          python skills/tests/check_runtime.py

      - name: Lint
        id: lint
        continue-on-error: true
        run: ruff check .

      - name: Format check
        id: format
        continue-on-error: true
        run: ruff format --check .

      - name: Type check
        id: type
        continue-on-error: true
        run: ty check

      - name: Build documentation
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict

      - name: Verify static checks
        if: ${{ always() && (steps.lint.outcome != 'success' || steps.format.outcome != 'success' || steps.type.outcome != 'success') }}
        run: exit 1

  test:
    runs-on: ika-runner-gpu
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Install nexuml + library
        run: |
          uv venv --python "${{ matrix.python-version }}"
          source .venv/bin/activate
          uv pip install -e ".[dev,all,dali]"
          uv pip install -e "./library[all]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"

      - name: Verify CUDA execution
        run: |
          python - <<'PY'
          import torch

          assert torch.cuda.is_available(), "CUDA is unavailable on ika-runner-gpu"
          capability = torch.cuda.get_device_capability()
          print(f"GPU: {torch.cuda.get_device_name()} (CC {capability[0]}.{capability[1]})")
          print(f"PyTorch: {torch.__version__}; architectures: {torch.cuda.get_arch_list()}")
          assert torch.ones(1, device="cuda").item() == 1
          PY

      - name: Run pytest suite with coverage
        run: pytest --cov=nexuml --cov=nexuml_library --cov-report=term-missing --cov-report=xml:reports/coverage.xml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Build distributions
        run: |
          uv build --package nexuml --out-dir dist/nexuml --clear
          uv build --package nexuml-library --out-dir dist/nexuml-library --clear

      - name: Validate distributions
        run: |
          uvx twine check dist/nexuml/* dist/nexuml-library/*
          NEXUML_DIST_ROOT=dist uvx pytest -c /dev/null --rootdir=tests/packaging --confcutdir=tests/packaging -q tests/packaging/test_distribution_artifacts.py

      - name: Rebuild wheels from source distributions
        run: |
          uv build dist/nexuml/nexuml-*.tar.gz --wheel --out-dir dist/rebuilt/nexuml --clear
          uv build dist/nexuml-library/nexuml_library-*.tar.gz --wheel --out-dir dist/rebuilt/nexuml-library --clear
          uvx twine check dist/rebuilt/nexuml/* dist/rebuilt/nexuml-library/*

      - name: Smoke test core wheel
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          uv venv --no-config --python 3.12 .venv-core
          uv pip install --no-config --python .venv-core/bin/python --default-index https://pypi.org/simple pytest dist/nexuml/*.whl
          env -u PYTHONPATH NEXUML_INSTALLED_DIST_TEST=1 .venv-core/bin/python -I -m pytest -c /dev/null --rootdir=tests/packaging --confcutdir=tests/packaging -q tests/packaging/test_installed_distributions.py -k core

      - name: Smoke test core and library wheels
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          uv venv --no-config --python 3.12 .venv-library
          uv pip install --no-config --python .venv-library/bin/python --default-index https://pypi.org/simple pytest dist/nexuml/*.whl dist/nexuml-library/*.whl
          env -u PYTHONPATH NEXUML_INSTALLED_DIST_TEST=1 .venv-library/bin/python -I -m pytest -c /dev/null --rootdir=tests/packaging --confcutdir=tests/packaging -q tests/packaging/test_installed_distributions.py -k library

      - name: Smoke test rebuilt wheels
        env:
          CUDA_VISIBLE_DEVICES: ""
        run: |
          uv venv --no-config --python 3.12 .venv-rebuilt-core
          uv pip install --no-config --python .venv-rebuilt-core/bin/python --default-index https://pypi.org/simple pytest dist/rebuilt/nexuml/*.whl
          env -u PYTHONPATH NEXUML_INSTALLED_DIST_TEST=1 .venv-rebuilt-core/bin/python -I -m pytest -c /dev/null --rootdir=tests/packaging --confcutdir=tests/packaging -q tests/packaging/test_installed_distributions.py -k core
          uv venv --no-config --python 3.12 .venv-rebuilt-library
          uv pip install --no-config --python .venv-rebuilt-library/bin/python --default-index https://pypi.org/simple pytest dist/rebuilt/nexuml/*.whl dist/rebuilt/nexuml-library/*.whl
          env -u PYTHONPATH NEXUML_INSTALLED_DIST_TEST=1 .venv-rebuilt-library/bin/python -I -m pytest -c /dev/null --rootdir=tests/packaging --confcutdir=tests/packaging -q tests/packaging/test_installed_distributions.py -k library

      - name: Upload validated distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-distributions
          retention-days: 7
          path: |
            dist/nexuml/*.whl
            dist/nexuml/*.tar.gz
            dist/nexuml-library/*.whl
            dist/nexuml-library/*.tar.gz
          if-no-files-found: error

  studio-static:
    name: Studio static
    runs-on: ika-runner
    timeout-minutes: 10
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check
        id: type
        continue-on-error: true
        run: npm run typecheck

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        id: test
        continue-on-error: true
        run: npm test

      - name: Verify Studio static checks
        if: ${{ always() && (steps.type.outcome != 'success' || steps.lint.outcome != 'success' || steps.test.outcome != 'success') }}
        run: exit 1

  studio-package:
    name: Studio package (${{ matrix.os }}, ${{ matrix.mode }})
    needs:
      - package
      - studio-static
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [tool, project]
    defaults:
      run:
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Download validated Python distributions
        uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist

      - name: Install and verify isolated ${{ matrix.mode }} runtime
        run: >-
          python scripts/studio-test-runtime.py
          --wheel dist/nexuml/nexuml-*.whl
          --library-wheel dist/nexuml-library/nexuml_library-*.whl
          --output "$RUNNER_TEMP/studio runtime ${{ matrix.mode }}"
          --mode ${{ matrix.mode }}

      - name: Install frontend dependencies
        working-directory: studio
        run: npm ci

      - name: Install headless test browser
        working-directory: studio
        run: npx playwright install chromium --with-deps --only-shell

      - name: Verify packaged startup and CPU browser workflow
        working-directory: studio
        run: npm run test:package 2>&1 | tee package-smoke.log

      - name: Upload Studio test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: studio-results-${{ matrix.os }}-${{ matrix.mode }}
          retention-days: 7
          path: |
            studio/package-smoke.log
            studio/playwright-report/
            studio/test-results/
          if-no-files-found: ignore

  required-ci:
    name: CI
    needs:
      - static
      - test
      - package
      - studio-static
      - studio-package
    if: ${{ always() }}
    runs-on: ika-runner

    steps:
      - name: Verify required jobs
        env:
          STATIC_RESULT: ${{ needs.static.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          STUDIO_STATIC_RESULT: ${{ needs.studio-static.result }}
          STUDIO_PACKAGE_RESULT: ${{ needs.studio-package.result }}
        run: |
          echo "static: $STATIC_RESULT"
          echo "test:   $TEST_RESULT"
          echo "package: $PACKAGE_RESULT"
          echo "studio-static: $STUDIO_STATIC_RESULT"
          echo "studio-package: $STUDIO_PACKAGE_RESULT"

          {
            echo "## CI results"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Python static | $STATIC_RESULT |"
            echo "| Python tests | $TEST_RESULT |"
            echo "| Python packages | $PACKAGE_RESULT |"
            echo "| Studio static | $STUDIO_STATIC_RESULT |"
            echo "| Studio packages | $STUDIO_PACKAGE_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATIC_RESULT" != "success" ] || \
             [ "$TEST_RESULT" != "success" ] || \
             [ "$PACKAGE_RESULT" != "success" ] || \
             [ "$STUDIO_STATIC_RESULT" != "success" ] || \
             [ "$STUDIO_PACKAGE_RESULT" != "success" ]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi
