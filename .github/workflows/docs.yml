name: Deploy docs

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    tags: ["v*", "!v*-rc.*"]

permissions:
  contents: read
  actions: read

jobs:
  release-identity:
    runs-on: ika-runner
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag eligibility before builds and tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_candidate.py eligibility

  validate:
    if: github.event_name == 'push'
    needs: release-identity
    uses: ./.github/workflows/docs-checks.yml
    with:
      version: ${{ github.ref_name }}

  stage:
    needs: validate
    runs-on: ika-runner
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    env:
      VERSION: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          name: docs-build-${{ github.sha }}-${{ github.ref_name }}
          path: candidate
      - name: Verify exact validated build identity
        run: python docs/scripts/verify_candidate.py --directory candidate --revision "$SOURCE_SHA" --version "$VERSION"
      - name: Configure ephemeral Git transport authentication
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          echo "GIT_CONFIG_COUNT=1" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_KEY_0=http.https://github.com/.extraheader" >> "$GITHUB_ENV"
          echo "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $auth" >> "$GITHUB_ENV"
      - name: Durably stage the event before entering the deployment queue
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          if [ "$VERSION" = main ] || [ "$VERSION" = dev ]; then
            git fetch --no-tags origin "refs/heads/$VERSION:refs/remotes/origin/$VERSION"
          fi
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          identity = json.loads(Path('candidate/versioned/build.json').read_text())
          version = os.environ['VERSION']
          args = ['python', 'docs/scripts/publication.py', '--stage', '--remote', 'origin',
                  '--repository', str(Path.cwd()), '--candidate', str(Path('candidate/versioned').resolve()),
                  '--version', version, '--revision', os.environ['SOURCE_SHA'],
                  '--site', identity['site'], '--mount', identity['mount']]
          if version in {'main', 'dev'}:
              args += ['--source-ref', f'refs/remotes/origin/{version}']
          if version == 'main':
              args += ['--changelog', str(Path('candidate/changelog').resolve())]
          subprocess.run(args, check=True)
          PY

      # Tag deployments can report success while serving the earlier branch artifact (deploy-pages#383).
      - name: Deploy the staged archive through a main-branch dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref main

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: release-identity
    runs-on: ika-runner
    timeout-minutes: 10
    concurrency:
      group: documentation-pages-deployment
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: source
          persist-credentials: false
      # This fetch happens after this job acquires its serialized deployment slot.
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: archive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Extract and verify the newest complete staged archive
        id: assembled
        env:
          OUTPUT: ${{ runner.temp }}/assembled-pages-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import os
          import runpy
          from pathlib import Path
          publication = runpy.run_path('source/docs/scripts/publication.py')
          output = Path(os.environ['OUTPUT'])
          publication['extract_archive'](Path('archive'), 'HEAD', output)
          publication['validate_tree'](output)
          publication['load_archive'](output)
          assert all(not p.is_file() or p.stat().st_nlink == 1 for p in output.rglob('*'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'path={output}\n')
          PY
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.assembled.outputs.path }}
      - name: Deploy assembled static archive
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify the public site serves the validated archive
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python source/docs/scripts/verify_live.py --directory "${{ steps.assembled.outputs.path }}" --url "$PAGE_URL"
