[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexuml-agent-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["nexuml>=0.2.1,<0.3"]

[project.entry-points."nexuml.libraries"]
agent-demo = "agent_demo"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_demo"]
