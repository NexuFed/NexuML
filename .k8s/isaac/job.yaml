# Uses the same verified image as the editor. Set a unique job name for each run.
apiVersion: batch/v1
kind: Job
metadata:
  name: isaac-training
  namespace: rglitza
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      runtimeClassName: nvidia
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        kubernetes.io/arch: amd64
        nvidia.com/gpu.product: NVIDIA-RTX-4000-Ada-Generation
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/cuda.driver.major
                    operator: Gt
                    values: ["594"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        runAsGroup: 1234
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: isaac
          image: harbor.ika.rub.de/library/nexuml-isaac@sha256:c0009c013a7c1f6fff881e9ad8f39f0f13749e97710ef72fd5d4ff81fa77455e
          imagePullPolicy: IfNotPresent
          workingDir: /mnt/persistent
          args:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              mkdir -p "$NEXUML_LOGS_ROOT"
              cd "$NEXUML_LOGS_ROOT"
              exec nexuml train --scenario-file "$NEXUML_WORKSPACE_ROOT/tasks/train.py"
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: OMNI_KIT_ACCEPT_EULA
              value: "YES"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility,graphics
            - name: JOB_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['batch.kubernetes.io/job-name']
            - name: NEXUML_WORKSPACE_ROOT
              value: /mnt/persistent/nexuml/isaac-workstation
            - name: NEXUML_DATA_ROOT
              value: $(NEXUML_WORKSPACE_ROOT)/assets
            - name: NEXUML_LOGS_ROOT
              value: $(NEXUML_WORKSPACE_ROOT)/runs/$(JOB_NAME)
          resources:
            requests:
              cpu: "4"
              memory: 32Gi
            limits:
              memory: 48Gi
              nvidia.com/gpu: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: workspace
              mountPath: /mnt/persistent
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: seaweedfs
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
