# NEX-233 experiment ONLY: branch-specific, not intended for main.
# Based on .k8s/scenarios/job_audioset.yaml (existing cluster PVCs and GPU).
# Before applying, the mounted /workspace must contain:
#  - NEX-233 src/nexuml and library/src/nexuml_library on JuiceFS
#  - a writable .experiments tree (init containers resolve configs) for seed 42.yaml
# All three jobs share upstream *data/checkpoint contents* and write
# distinct run-specific checkpoint/report paths. Prepare upstream artifacts first.
apiVersion: batch/v1
kind: Job
metadata:
  name: nexuml-rul-fd003-cfc-six-s42
  labels:
    app.kubernetes.io/name: nexuml
    nexuml-study: rul-fd003-cfc-six
    nexuml-seed: "42"
spec:
  # Keep finished Jobs/logs for inspection; checkpoints live on JuiceFS.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexuml
        nexuml-study: rul-fd003-cfc-six
        nexuml-seed: "42"
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      imagePullSecrets:
        - name: regcred
      # The existing NexuML training image is built for linux/amd64 in CI.
      # Do not schedule this pod on ARM64 GH200 without a compatible image.
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
        - name: shared-mem
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: local-storage
          emptyDir: {}
        - name: juicefs
          persistentVolumeClaim:
            claimName: juicefs
        - name: juicefs-prisma
          persistentVolumeClaim:
            claimName: juicefs-prisma
      # Resolve using the image's /workspace root, not a local-machine path.
      initContainers:
        - name: resolve-config
          image: harbor.ika.rub.de/library/nexuml:latest
          imagePullPolicy: Always
          workingDir: /workspace
          command: ["nexuml"]
          args:
            - resolve
            - maintenance-rul-enhanced-cfc-fd003-compare-six
            - --output
            - .experiments/rul/enhanced-cfc/fd003/compare-six-s42.yaml
          volumeMounts:
            - name: juicefs
              subPathExpr: code/nexuml/.experiments
              mountPath: /workspace/.experiments
            - name: juicefs
              subPathExpr: code/nexuml/data
              mountPath: /workspace/data
            # Overlay ONLY the two packages from the NEX-233 workspace.
            # Do not hide /workspace or /env from the latest image.
            - name: juicefs
              subPathExpr: code/nexuml/src/nexuml
              mountPath: /workspace/src/nexuml
            - name: juicefs
              subPathExpr: code/nexuml/library/src/nexuml_library
              mountPath: /workspace/library/src/nexuml_library
      containers:
        - name: nexuml
          image: harbor.ika.rub.de/library/nexuml:latest
          imagePullPolicy: Always
          workingDir: /workspace
          # Keep the latest image's installed Python dependencies and entrypoint.
          command: ["nexuml"]
          args:
            - train
            - --config
            - .experiments/rul/enhanced-cfc/fd003/compare-six-s42.yaml
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: shared-mem
              mountPath: /dev/shm
            - name: local-storage
              mountPath: /mnt/local
            - name: juicefs-prisma
              subPathExpr: data
              mountPath: /mnt/data
            - name: juicefs-prisma
              subPathExpr: logs
              mountPath: /mnt/logs
            # Editable package paths are overlaid from the branch workspace.
            - name: juicefs
              subPathExpr: code/nexuml/.experiments
              mountPath: /workspace/.experiments
            - name: juicefs
              subPathExpr: code/nexuml/data
              mountPath: /workspace/data
            # Overlay ONLY the two packages from the NEX-233 workspace.
            # Do not hide /workspace or /env from the latest image.
            - name: juicefs
              subPathExpr: code/nexuml/src/nexuml
              mountPath: /workspace/src/nexuml
            - name: juicefs
              subPathExpr: code/nexuml/library/src/nexuml_library
              mountPath: /workspace/library/src/nexuml_library
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/cuda.runtime.major
                    operator: Gt
                    values: ["11"]
---


