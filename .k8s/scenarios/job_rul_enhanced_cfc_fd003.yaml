# NEX-233 experiment ONLY: branch-specific, not intended for main.
# Based on .k8s/scenarios/job_audioset.yaml (existing cluster PVCs and GPU).
# Before applying, the mounted /workspace must contain:
#  - a complete NEX-233 feature-branch checkout on JuiceFS at code/nexuml
#  - a writable .experiments tree for generated seed-42 configs
# All three jobs share upstream *data/checkpoint contents* and write
# distinct run-specific checkpoint/report paths. Prepare upstream artifacts first.
apiVersion: batch/v1
kind: Job
metadata:
  name: nexuml-rul-fd003-cfc-six-s42
  labels:
    app.kubernetes.io/name: nexuml
    nexuml-study: rul-fd003-cfc-six
    nexuml-seed: "42"
spec:
  # Keep finished Jobs/logs for inspection; checkpoints live on JuiceFS.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexuml
        nexuml-study: rul-fd003-cfc-six
        nexuml-seed: "42"
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      imagePullSecrets:
        - name: regcred
      # The existing NexuML training image is built for linux/amd64 in CI.
      # Do not schedule this pod on ARM64 GH200 without a compatible image.
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
        - name: shared-mem
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
        - name: local-storage
          emptyDir: {}
        - name: juicefs
          persistentVolumeClaim:
            claimName: juicefs
        - name: juicefs-prisma
          persistentVolumeClaim:
            claimName: juicefs-prisma
      # Reject missing/stale shared checkouts before resolving or training.
      initContainers:
        - name: verify-source
          image: harbor.ika.rub.de/library/nexuml:latest
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          command: ["/env/bin/python", "-c"]
          args:
            - |
              from pathlib import Path
              root = Path("/mnt/nexuml-source")
              required = (
                  root / "src/nexuml/cli/main.py",
                  root / "library/src/nexuml_library/scenarios/maintenance/rul_enhanced_cfc.py",
                  root / "library/src/nexuml_library/evaluation/maintenance/rul_composite_comparison.py",
              )
              missing = [str(path) for path in required if not path.is_file()]
              if missing:
                  raise SystemExit(
                      "NEX-233 shared checkout incomplete at code/nexuml: "
                      + ", ".join(missing)
                      + ". Sync the feature branch into the JuiceFS source tree."
                  )
              print("NEX-233 shared checkout paths verified", flush=True)
          volumeMounts:
            - name: juicefs
              subPathExpr: code/nexuml
              mountPath: /mnt/nexuml-source
              readOnly: true
        - name: resolve-config
          image: harbor.ika.rub.de/library/nexuml:latest
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            - name: PYTHONPATH
              value: /mnt/nexuml-source/src:/mnt/nexuml-source/library/src
          command: ["nexuml"]
          args:
            - resolve
            - maintenance-rul-enhanced-cfc-fd003-compare-six
            - --output
            - .experiments/rul/enhanced-cfc/fd003/compare-six-s42.yaml
          volumeMounts:
            - name: juicefs
              subPathExpr: code/nexuml/.experiments
              mountPath: /workspace/.experiments
            - name: juicefs
              subPathExpr: code/nexuml/data
              mountPath: /workspace/data
            # Keep the image installation intact; import branch code from
            # this separate, complete repository mount.
            - name: juicefs
              subPathExpr: code/nexuml
              mountPath: /mnt/nexuml-source
              readOnly: true
      containers:
        - name: nexuml
          image: harbor.ika.rub.de/library/nexuml:latest
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            - name: PYTHONPATH
              value: /mnt/nexuml-source/src:/mnt/nexuml-source/library/src
          # Keep the latest image's Python dependencies and NexuML entrypoint.
          command: ["nexuml"]
          args:
            - train
            - --config
            - .experiments/rul/enhanced-cfc/fd003/compare-six-s42.yaml
          resources:
            requests:
              nvidia.com/gpu: "1"
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: shared-mem
              mountPath: /dev/shm
            - name: local-storage
              mountPath: /mnt/local
            - name: juicefs-prisma
              subPathExpr: data
              mountPath: /mnt/data
            - name: juicefs-prisma
              subPathExpr: logs
              mountPath: /mnt/logs
            # Editable package paths are overlaid from the branch workspace.
            - name: juicefs
              subPathExpr: code/nexuml/.experiments
              mountPath: /workspace/.experiments
            - name: juicefs
              subPathExpr: code/nexuml/data
              mountPath: /workspace/data
            # Keep the image installation intact; import branch code from
            # this separate, complete repository mount.
            - name: juicefs
              subPathExpr: code/nexuml
              mountPath: /mnt/nexuml-source
              readOnly: true
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/cuda.runtime.major
                    operator: Gt
                    values: ["11"]
---



