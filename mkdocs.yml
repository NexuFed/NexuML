site_name: NexuML
site_description: Modular deep learning pipeline framework
site_url: https://nexufed.github.io/NexuML/
repo_name: NexuFed/NexuML
repo_url: https://github.com/NexuFed/NexuML
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.instant.prefetch
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
    default: latest

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [src, library/src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - mkdocs-click
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [.]
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Get started:
    - start/index.md
    - Installation: start/install.md
    - Your first scenario: start/train-cifar-resnet.md
  - Tutorials: tutorials.md
  - Guides:
    - how-to/index.md
    - Core workflow:
      - CLI lifecycle: how-to/cli-lifecycle.md
    - Scenarios and configuration:
      - Define a scenario: how-to/define-scenario.md
      - Run scenarios: how-to/run-scenarios.md
      - Trusted scenario files: how-to/scenario-file.md
    - Training and evaluation:
      - Train a model: how-to/train.md
      - Evaluate a model: how-to/evaluate.md
      - Checkpoints: how-to/checkpoints.md
      - Automatic batch size: how-to/auto-batch-size.md
    - Data:
      - Choose a data loader: how-to/data-loading.md
      - Export a dataset: how-to/export-dataset.md
    - Experimentation:
      - Tracking and logging: how-to/tracking.md
      - Optuna tuning: how-to/tune.md
    - Model export:
      - Export and reload: how-to/export.md
    - Execution:
      - Overview: how-to/training-backends/index.md
      - Ray: how-to/training-backends/ray.md
    - Extending NexuML:
      - Custom library: how-to/custom-library.md
      - Add a custom layer: how-to/custom-layer.md
      - Add a custom data source: how-to/custom-data-source.md
      - Add a custom eval algorithm: how-to/custom-eval-algorithm.md
      - Register a library: how-to/register-library.md
      - Manage local library roots: how-to/library-cli.md
  - Concepts:
    - explanation/index.md
    - Mental model: learn/mental-model.md
    - Architecture: explanation/architecture.md
    - TensorDict data flow: explanation/tensordict.md
    - Scenarios and configuration: learn/scenarios.md
    - Components and discovery: learn/decorators-and-discovery.md
    - Coming from Lightning: learn/from-lightning.md
    - Pipeline diagrams: explanation/diagrams.md
    - Library discovery: explanation/library-discovery.md
  - Reference:
    - reference/index.md
    - CLI: reference/cli.md
    - Scenario and config: reference/scenario-spec.md
    - Decorators: reference/decorators.md
    - Registry inspection: reference/registry.md
    - Backends: reference/backends.md
    - Environment roots: reference/environment.md
    - Tuning file: reference/tuning-file.md
    - Python API: reference/api/
  - Development:
    - development/index.md
    - Install for development: development/install.md
    - Development setup: how-to/development.md
    - Publish a release: development/release.md
    - Experimental autoresearch: how-to/autoresearch.md
    - Publish docs: how-to/github-pages.md
